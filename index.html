
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISLAND ESCAPE</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#09121b;color:#eaf2f5;
 font-family:Arial,sans-serif;overflow:hidden
}
button,input{font:inherit}
button{
 background:#d49b48;color:#151b20;border:0;
 padding:12px 20px;border-radius:7px;
 font-weight:bold;cursor:pointer
}
button:hover{filter:brightness(1.13)}
button:disabled{opacity:.35;cursor:not-allowed}
input{
 background:#101e29;color:white;border:1px solid #344b5b;
 padding:12px;border-radius:7px;width:100%;outline:none
}
.panel{
 background:#132330;border:1px solid #2d4351;
 border-radius:12px;padding:24px;
 box-shadow:0 15px 50px #0008
}
.screen{
 position:absolute;inset:0;display:flex;
 justify-content:center;align-items:center;padding:20px
}
.hidden{display:none!important}
.menu{width:min(460px,100%)}
h1{font-size:36px;letter-spacing:3px;margin:0 0 8px}
h2{margin:0 0 16px}
.subtitle{color:#9db0bd;margin-bottom:25px}
.field{margin:15px 0}
.field label{display:block;color:#9fb3c0;font-size:13px;margin-bottom:7px}
.actions{display:grid;gap:10px}
.secondary{background:#263c4b;color:white}
.status{
 min-height:22px;color:#e7b969;font-size:13px;

}
#lobbyPlayers{display:grid;gap:8px;margin:18px 0}
.playerRow{
 background:#1d3240;padding:11px 13px;border-radius:7px;
 display:flex;justify-content:space-between;align-items:center
}
.small{font-size:12px;color:#9db0bd}
#gameScreen{position:absolute;inset:0;display:none}
#gameCanvas{width:100%;height:100%;display:block}
#hud{
 position:absolute;left:15px;top:15px;
 width:min(330px,calc(100% - 30px));
 background:#101c26eF;border:1px solid #526775;
 border-radius:10px;padding:13px;pointer-events:none
}
#hudTitle{font-weight:bold;font-size:16px;margin-bottom:6px}
#objective{font-size:13px;color:#d6e0e5;line-height:1.5}
#taskList{margin-top:8px;font-size:12px;color:#a9bdc8;line-height:1.6}
#playerList{
 position:absolute;right:15px;top:15px;
 background:#101c26eF;border:1px solid #526775;
 border-radius:10px;padding:12px;min-width:155px;
 font-size:12px;pointer-events:none
}
#playerList strong{display:block;margin-bottom:7px}
#controls{
 position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
 background:#101c26dd;border:1px solid #526775;
 border-radius:8px;padding:9px 14px;
 font-size:12px;color:#c4d1d8;white-space:nowrap;
 pointer-events:none
}
#toast{
 position:absolute;left:50%;top:18%;
 transform:translateX(-50%);
 background:#101c26ed;border:1px solid #d49b48;
 padding:12px 20px;border-radius:8px;
 display:none;text-align:center;pointer-events:none
}
#endScreen{background:#09121bf2;z-index:5}
#endScreen .panel{text-align:center;max-width:420px;width:100%}
#roomCode{font-weight:bold;letter-spacing:2px}
@media(max-width:600px){
 h1{font-size:28px}
 .panel{padding:18px}
 #playerList{top:auto;bottom:65px;right:10px}
 #controls{font-size:10px;bottom:10px}
}
</style>
</head>
<body>

<div id="menuScreen" class="screen">
 <div class="panel menu">
  <h1>ISLAND ESCAPE</h1>
  <div class="subtitle">Escape the island. Work together. Stay hidden.</div>

  <div class="field">
   <label for="playerName">YOUR PLAYER NAME</label>
   <input id="playerName" maxlength="18" placeholder="Enter your name">
  </div>

  <div class="actions">
   <button onclick="createRoom()">CREATE ROOM</button>
   <div class="field">
    <label for="joinCode">ROOM CODE</label>
    <input id="joinCode" placeholder="Paste host room code">
   </div>
   <button class="secondary" onclick="joinRoom()">JOIN ROOM</button>
  </div>
  <div id="menuStatus" class="status">Ready.</div>
  <div class="small">Requires an internet connection for multiplayer.</div>
 </div>
</div>

<div id="lobbyScreen" class="screen hidden">
 <div class="panel menu">
  <h2>GAME LOBBY</h2>
  <div class="small">Give this room code to your friends:</div>
  <div class="field">
   <input id="displayRoomCode" readonly>
   <button class="secondary" style="width:100%;margin-top:8px" onclick="copyRoomCode()">COPY ROOM CODE</button>
  </div>
  <div class="small">PLAYERS</div>
  <div id="lobbyPlayers"></div>
  <button id="startButton" style="width:100%" onclick="startGame()" disabled>START GAME</button>
  <div id="lobbyStatus" class="status">Waiting for players...</div>
  <button class="secondary" style="width:100%;margin-top:12px" onclick="leaveGame()">LEAVE ROOM</button>
 </div>
</div>

<div id="gameScreen">
 <canvas id="gameCanvas"></canvas>
 <div id="hud">
  <div id="hudTitle">ISLAND ESCAPE</div>
  <div id="objective">Loading...</div>
  <div id="taskList"></div>
 </div>
 <div id="playerList"></div>
 <div id="controls">WASD: Move | SHIFT: Sprint | CTRL: Crouch | E: Interact / Hide</div>
 <div id="toast"></div>
</div>

<div id="endScreen" class="screen hidden">
 <div class="panel">
  <h1 id="endTitle">GAME OVER</h1>
  <p id="endText"></p>
  <button onclick="returnToMenu()">RETURN TO MENU</button>
 </div>
</div>

<script>
"use strict";

/* =========================================
   ISLAND ESCAPE
   Single-file PeerJS multiplayer game
========================================= */

const $=id=>document.getElementById(id);

const WORLD={w:2000,h:1400};
const MAX_PLAYERS=5;

let peer=null;
let hostConnection=null;
let connections=[];
let myId=null;
let myName="";
let isHost=false;

let players=[];
let game=null;
let running=false;
let lastFrame=0;
let sendTimer=0;
let inputTimer=0;
let toastTimer=0;

const canvas=$("gameCanvas");
const ctx=canvas.getContext("2d");

const localInput={
 up:false,down:false,left:false,right:false,
 sprint:false,crouch:false,interact:false
};

const TASK_DEFINITIONS=[
 {name:"Repair the generator",x:430,y:380},
 {name:"Repair the radio",x:1450,y:370},
 {name:"Repair the boat engine",x:1530,y:1050},
 {name:"Repair the boat hull",x:1320,y:1110}
];

const HIDING_SPOTS=[
 {x:600,y:290,w:55,h:45,name:"Storage locker"},
 {x:980,y:500,w:65,h:45,name:"Wardrobe"},
 {x:1220,y:760,w:60,h:45,name:"Bushes"},
 {x:540,y:930,w:65,h:45,name:"Wardrobe"},
 {x:1650,y:780,w:65,h:45,name:"Storage locker"},
 {x:900,y:1120,w:75,h:45,name:"Bushes"}
];

const BUILDINGS=[
 {x:270,y:210,w:430,h:300,name:"MAIN HOUSE"},
 {x:850,y:200,w:400,h:290,name:"WORKSHOP"},
 {x:330,y:730,w:390,h:300,name:"DORMITORY"},
 {x:1050,y:690,w:360,h:300,name:"STORAGE"}
];

const TREES=[
 [160,180],[210,530],[760,160],[790,600],[1500,170],
 [1770,280],[1800,570],[1650,950],[1750,1190],
 [220,1150],[850,1250],[1100,570],[700,1050],
 [1350,200],[1450,550],[930,850],[250,650],
 [1830,850],[1550,500],[120,950],[500,1200],
 [1150,1150],[760,850],[350,570],[1650,350]
];

/* =========================================
   SCREEN AND STATUS
========================================= */

function showScreen(name){
 $("menuScreen").classList.toggle("hidden",name!=="menu");
 $("lobbyScreen").classList.toggle("hidden",name!=="lobby");
 $("gameScreen").style.display=name==="game"?"block":"none";
 $("endScreen").classList.toggle("hidden",name!=="end");
}

function setStatus(message){
 $("menuStatus").textContent=message;
 $("lobbyStatus").textContent=message;
}

function setLobbyStatus(message){
 $("lobbyStatus").textContent=message;
}

function getName(){
 const name=$("playerName").value.trim();
 if(!name){
  setStatus("Enter a player name first.");
  $("playerName").focus();
  return null;
 }
 return name.slice(0,18);
}

function copyRoomCode(){
 const code=$("displayRoomCode").value;
 if(!code)return;
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(code)
   .then(()=>setLobbyStatus("Room code copied!"))
   .catch(()=>setLobbyStatus("Copy the room code manually."));
 }else{
  $("displayRoomCode").select();
  setLobbyStatus("Press Ctrl+C to copy.");
 }
}

function showToast(message){
 $("toast").textContent=message;
 $("toast").style.display="block";
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>$("toast").style.display="none",2200);
}

/* =========================================
   NETWORK CLEANUP
========================================= */

function cleanupNetwork(){
 running=false;

 if(hostConnection){
  try{hostConnection.close()}catch(e){}
  hostConnection=null;
 }

 connections.forEach(c=>{
  try{c.close()}catch(e){}
 });
 connections=[];

 if(peer){
  try{peer.destroy()}catch(e){}
  peer=null;
 }

 myId=null;
 isHost=false;
 players=[];
 game=null;
}

function leaveGame(){
 cleanupNetwork();
 showScreen("menu");
 setStatus("You left the room.");
}

function returnToMenu(){
 cleanupNetwork();
 showScreen("menu");
 setStatus("Ready.");
}

/* =========================================
   PLAYER CREATION
========================================= */

function createPlayer(id,name){
 return {
  id,
  name,
  x:300+Math.random()*100,
  y:600+Math.random()*100,
  role:"escapee",
  alive:true,
  escaped:false,
  hidden:false,
  input:{},
  prevInteract:false,
  actionCooldown:0,
  taskProgress:0,
  facing:0
 };
}

function newGame(){
 return {
  started:true,
  ended:false,
  time:0,
  tasks:TASK_DEFINITIONS.map(t=>({
   name:t.name,x:t.x,y:t.y,done:false
  })),
  boat:{x:1510,y:1190},
  message:"Complete all four repairs and escape by boat."
 };
}

/* =========================================
   HOST ROOM CREATION
========================================= */

function createRoom(){
 const name=getName();
 if(!name)return;

 if(!window.Peer){
  setStatus("PeerJS failed to load. Check your internet.");
  return;
 }

 cleanupNetwork();

 myName=name;
 setStatus("Connecting to PeerJS...");

 try{
  peer=new Peer();
 }catch(error){
  setStatus("Could not create PeerJS connection.");
  console.error(error);
  return;
 }

 peer.on("open",id=>{
  myId=id;
  isHost=true;

  players=[createPlayer(id,myName)];
  game=newGame();
  game.started=false;

  $("displayRoomCode").value=id;
  $("startButton").disabled=true;

  showScreen("lobby");
  refreshLobby();
  setLobbyStatus("Room created. Waiting for players...");
  console.log("Host registered with PeerJS:",id);
 });

 peer.on("connection",conn=>{
  console.log("Incoming connection:",conn.peer);

  connections.push(conn);

  conn.on("open",()=>{
   console.log("Incoming connection opened:",conn.peer);
   try{
    conn.send({type:"welcome"});
   }catch(error){
    console.error("Welcome message failed:",error);
   }
  });

  conn.on("data",data=>{
   handleHostData(conn,data);
  });

  conn.on("close",()=>{
   console.log("Connection closed:",conn.peer);
   connections=connections.filter(c=>c!==conn);
   players=players.filter(p=>p.id!==conn.peer);
   refreshLobby();
   sendLobby();
  });

  conn.on("error",error=>{
   console.error("Incoming connection error:",error);
   setLobbyStatus("A player connection encountered an error.");
  });
 });

 peer.on("disconnected",()=>{
  setLobbyStatus("Disconnected from PeerJS. Reconnecting...");
  if(peer&&!peer.destroyed){
   peer.reconnect();
  }
 });

 peer.on("error",error=>{
  console.error("Host PeerJS error:",error);
  setLobbyStatus("PeerJS error: "+error.type);
 });

 peer.on("close",()=>{
  console.log("Host peer closed.");
 });
}

/* =========================================
   GUEST ROOM JOINING
========================================= */

function joinRoom(){
 const name=getName();
 if(!name)return;

 const code=$("joinCode").value.trim();

 if(!code){
  setStatus("Enter a room code.");
  return;
 }

 if(!window.Peer){
  setStatus("PeerJS failed to load. Check your internet.");
  return;
 }

 cleanupNetwork();

 myName=name;
 setStatus("Connecting to PeerJS...");

 try{
  peer=new Peer();
 }catch(error){
  setStatus("Could not create PeerJS connection.");
  console.error(error);
  return;
 }

 peer.on("open",id=>{
  myId=id;
  isHost=false;

  setStatus("Finding host...");

  console.log("Guest registered with PeerJS:",id);
  console.log("Connecting to room:",code);

  hostConnection=peer.connect(code,{reliable:true});

  if(!hostConnection){
   setStatus("Could not create connection to host.");
   return;
  }

  hostConnection.on("open",()=>{
   console.log("Connected to host:",code);
   setStatus("Connected! Joining lobby...");

   hostConnection.send({
    type:"join",
    name:myName
   });
  });

  hostConnection.on("data",data=>{
   handleGuestData(data);
  });

  hostConnection.on("close",()=>{
   console.log("Host connection closed.");
   if(running){
    finishLocalGame("DISCONNECTED","The host connection was lost.");
   }else{
    setStatus("Disconnected from host.");
   }
  });

  hostConnection.on("error",error=>{
   console.error("Guest connection error:",error);
   setStatus("Connection failed: "+error.type);
  });

  setTimeout(()=>{
   if(hostConnection&&!hostConnection.open){
    setStatus("Could not connect. Check the room code and host connection.");
   }
  },15000);
 });

 peer.on("disconnected",()=>{
  setStatus("Disconnected from PeerJS server.");
  if(peer&&!peer.destroyed)peer.reconnect();
 });

 peer.on("error",error=>{
  console.error("Guest PeerJS error:",error);
  setStatus("PeerJS error: "+error.type);
 });
}

/* =========================================
   HOST MESSAGE HANDLING
========================================= */

function handleHostData(conn,data){
 if(!isHost||!data)return;

 if(data.type==="join"){
  if(game&&game.started){
   conn.send({type:"full"});
   return;
  }

  if(players.length>=MAX_PLAYERS){
   conn.send({type:"full"});
   return;
  }

  let player=players.find(p=>p.id===conn.peer);

  if(!player){
   const safeName=String(data.name||"Player").slice(0,18);
   player=createPlayer(conn.peer,safeName);
   players.push(player);
   console.log("Player joined:",safeName);
  }

  sendLobby();
  refreshLobby();
 }

 if(data.type==="input"){
  const p=players.find(p=>p.id===conn.peer);
  if(p&&p.alive&&!p.escaped){
   p.input=data.input||{};
  }
 }
}

/* =========================================
   GUEST MESSAGE HANDLING
========================================= */

function handleGuestData(data){
 if(!data)return;

 if(data.type==="welcome"){
  console.log("Host welcomed guest.");
 }

 if(data.type==="lobby"){
  $("lobbyPlayers").innerHTML=data.players.map(p=>
   '<div class="playerRow"><span>'+escapeHtml(p.name)+'</span></div>'
  ).join("");

  $("displayRoomCode").value=$("joinCode").value.trim();
  showScreen("lobby");
  $("startButton").disabled=true;
  setLobbyStatus("Connected to host. Waiting for the game to start.");
 }

 if(data.type==="full"){
  setStatus("That room is full or the game has already started.");
 }

 if(data.type==="start"){
  game=data.game;
  players=game.players;
  beginGame();
 }

 if(data.type==="state"){
  game=data.game;
  players=game.players;

  if(!running&&game.started&&!game.ended){
   beginGame();
  }

  updateHUD();
 }

 if(data.type==="end"){
  finishLocalGame(data.title,data.text);
 }
}

/* =========================================
   LOBBY SYNCHRONISATION
========================================= */

function refreshLobby(){
 if(!isHost)return;

 $("lobbyPlayers").innerHTML=players.map(p=>
  '<div class="playerRow"><span>'+escapeHtml(p.name)+'</span>'+
  '<span class="small">'+(p.id===myId?"HOST":"PLAYER")+'</span></div>'
 ).join("");

 $("startButton").disabled=players.length<2;

 if(players.length<2){
  setLobbyStatus("Waiting for at least one more player...");
 }else{
  setLobbyStatus(players.length+" players connected. Ready to start!");
 }

 sendLobby();
}

function sendLobby(){
 const data={
  type:"lobby",
  players:players.map(p=>({id:p.id,name:p.name}))
 };

 connections.forEach(c=>{
  if(c.open){
   try{c.send(data)}catch(error){
    console.error("Lobby send failed:",error);
   }
  }
 });
}

/* =========================================
   START GAME
========================================= */

function startGame(){
 if(!isHost||players.length<2)return;

 game=newGame();

 players.forEach((p,i)=>{
  p.x=300+(i%3)*90;
  p.y=600+Math.floor(i/3)*100;
  p.alive=true;
  p.escaped=false;
  p.hidden=false;
  p.taskProgress=0;
  p.actionCooldown=0;
  p.prevInteract=false;
  p.input={};
  p.role="escapee";
 });

 const hunterIndex=Math.floor(Math.random()*players.length);
 players[hunterIndex].role="hunter";

 game.started=true;
 game.message="Escapees: repair the boat. Hunter: stop them.";

 const packet={
  type:"start",
  game:serialiseGame()
 };

 connections.forEach(c=>{
  if(c.open){
   try{c.send(packet)}catch(error){
    console.error("Start message failed:",error);
   }
  }
 });

 beginGame();
}

function serialiseGame(){
 return JSON.parse(JSON.stringify({
  ...game,
  players:players.map(p=>({...p,input:{}}))
 }));
}

function beginGame(){
 if(running)return;

 running=true;
 lastFrame=performance.now();
 sendTimer=0;
 inputTimer=0;

 showScreen("game");
 updateHUD();
 requestAnimationFrame(loop);
}

/* =========================================
   INPUT
========================================= */

function updateKey(event,value){
 const key=event.key.toLowerCase();

 if(["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright",
     " ","shift","control","e"].includes(key)){
  event.preventDefault();
 }

 if(key==="w"||key==="arrowup")localInput.up=value;
 if(key==="s"||key==="arrowdown")localInput.down=value;
 if(key==="a"||key==="arrowleft")localInput.left=value;
 if(key==="d"||key==="arrowright")localInput.right=value;
 if(key==="shift")localInput.sprint=value;
 if(key==="control")localInput.crouch=value;
 if(key==="e")localInput.interact=value;
}

window.addEventListener("keydown",event=>{
 if(event.repeat)return;
 updateKey(event,true);
});

window.addEventListener("keyup",event=>{
 updateKey(event,false);
});

window.addEventListener("blur",()=>{
 Object.keys(localInput).forEach(k=>localInput[k]=false);
});

function sendInput(){
 if(!hostConnection||!hostConnection.open)return;

 try{
  hostConnection.send({
   type:"input",
   input:{...localInput}
  });
 }catch(error){
  console.error("Input send failed:",error);
 }
}

/* =========================================
   MAIN GAME LOOP
========================================= */

function loop(now){
 if(!running)return;

 const dt=Math.min((now-lastFrame)/1000,.05);
 lastFrame=now;

 if(isHost){
  const hostPlayer=players.find(p=>p.id===myId);

  if(hostPlayer&&hostPlayer.alive){
   hostPlayer.input={...localInput};
  }

  updateHost(dt);

  sendTimer+=dt;
  if(sendTimer>=.08){
   sendTimer=0;
   sendState();
  }
 }else{
  inputTimer+=dt;
  if(inputTimer>=.05){
   inputTimer=0;
   sendInput();
  }
 }

 render();
 updateHUD();

 if(running)requestAnimationFrame(loop);
}

/* =========================================
   HOST GAME SIMULATION
========================================= */

function updateHost(dt){
 if(!game||game.ended)return;

 game.time+=dt;

 for(const p of players){
  if(!p.alive||p.escaped)continue;

  const input=p.input||{};
  p.actionCooldown=Math.max(0,p.actionCooldown-dt);

  if(p.hidden){
   if(input.interact&&!p.prevInteract){
    p.hidden=false;
    p.actionCooldown=.3;
   }
   p.prevInteract=!!input.interact;
   continue;
  }

  let dx=(input.right?1:0)-(input.left?1:0);
  let dy=(input.down?1:0)-(input.up?1:0);

  const length=Math.hypot(dx,dy);
  if(length>0){
   dx/=length;
   dy/=length;
   p.facing=Math.atan2(dy,dx);
  }

  let speed=p.role==="hunter"?220:195;

  if(p.role==="hunter"&&input.sprint)speed=310;
  if(p.role!=="hunter"&&input.sprint)speed=270;
  if(input.crouch&&p.role!=="hunter")speed=105;

  p.x+=dx*speed*dt;
  p.y+=dy*speed*dt;

  p.x=Math.max(125,Math.min(WORLD.w-125,p.x));
  p.y=Math.max(125,Math.min(WORLD.h-125,p.y));

  const pressed=input.interact&&!p.prevInteract;

  if(p.role==="escapee"){
   updateEscapee(p,input,pressed,dt);
  }else{
   updateHunter(p);
  }

  p.prevInteract=!!input.interact;
 }

 const escapees=players.filter(p=>p.role==="escapee");
 const alive=escapees.filter(p=>p.alive&&!p.escaped);

 if(escapees.length>0&&alive.length===0){
  finishGame("HUNTER WINS","All escapees have been caught.");
 }
}

function updateEscapee(p,input,pressed,dt){
 const task=game.tasks.find(t=>
  !t.done&&distance(p,t)<75
 );

 if(task&&input.interact){
  p.taskProgress+=dt;

  if(p.taskProgress>=1.6){
   task.done=true;
   p.taskProgress=0;
   game.message=task.name+" completed!";
  }
  return;
 }else{
  p.taskProgress=0;
 }

 if(pressed&&p.actionCooldown<=0){
  const spot=HIDING_SPOTS.find(s=>
   distance(p,{x:s.x+s.w/2,y:s.y+s.h/2})<65
  );

  if(spot){
   p.hidden=true;
   p.actionCooldown=.3;
   return;
  }

  const allDone=game.tasks.every(t=>t.done);

  if(allDone&&distance(p,game.boat)<85){
   p.escaped=true;
   game.message=p.name+" escaped by boat!";

   const remaining=players.some(q=>
    q.role==="escapee"&&q.alive&&!q.escaped
   );

   if(!remaining){
    finishGame("ESCAPEES WIN","Everyone made it off the island!");
   }
  }
 }
}

function updateHunter(p){
 for(const target of players){
  if(target.role!=="escapee"||!target.alive||target.escaped||target.hidden)continue;

  if(distance(p,target)<34){
   target.alive=false;
   target.hidden=false;
   game.message=target.name+" has been caught!";
  }
 }
}

/* =========================================
   GAME END AND STATE UPDATES
========================================= */

function sendState(){
 if(!isHost||!game)return;

 const packet={
  type:"state",
  game:serialiseGame()
 };

 connections.forEach(c=>{
  if(c.open){
   try{c.send(packet)}catch(error){
    console.error("State send failed:",error);
   }
  }
 });
}

function finishGame(title,text){
 if(!isHost)return;

 if(game)game.ended=true;

 connections.forEach(c=>{
  if(c.open){
   try{c.send({type:"end",title,text})}catch(error){}
  }
 });

 finishLocalGame(title,text);
}

function finishLocalGame(title,text){
 running=false;
 $("endTitle").textContent=title;
 $("endText").textContent=text;
 showScreen("end");
}

function distance(a,b){
 return Math.hypot(a.x-b.x,a.y-b.y);
}

/* =========================================
   HUD
========================================= */

function updateHUD(){
 if(!game||!players.length)return;

 const me=players.find(p=>p.id===myId);
 if(!me)return;

 const tasksDone=game.tasks.filter(t=>t.done).length;
 const allDone=tasksDone===game.tasks.length;

 if(me.role==="hunter"){
  $("objective").textContent="You are the hunter. Find the escapees before they finish their repairs.";
 }else if(me.escaped){
  $("objective").textContent="You escaped! Waiting for the game to finish.";
 }else if(!me.alive){
  $("objective").textContent="You have been caught. Spectating...";
 }else if(allDone){
  $("objective").textContent="All repairs complete! Reach the boat and press E.";
 }else{
  $("objective").textContent="Repair the island equipment. Hold E near a repair station.";
 }

 $("taskList").innerHTML=
  game.tasks.map(t=>
   (t.done?"✓ ":"○ ")+escapeHtml(t.name)
  ).join("<br>")+
  "<br><br>Repairs: "+tasksDone+"/"+game.tasks.length;

 $("playerList").innerHTML=
  "<strong>PLAYERS</strong>"+
  players.map(p=>{
   let status=p.escaped?"ESCAPED":!p.alive?"CAUGHT":p.hidden?"HIDDEN":p.role==="hunter"?"HUNTER":"ESCAPEE";
   return "<div style='margin:5px 0'>"+
    escapeHtml(p.name)+" <span style='color:#d5ad6c'>"+status+"</span></div>";
  }).join("");
}

/* =========================================
   CANVAS RENDERING
========================================= */

function resizeCanvas(){
 const dpr=Math.min(window.devicePixelRatio||1,2);
 canvas.width=Math.floor(canvas.clientWidth*dpr);
 canvas.height=Math.floor(canvas.clientHeight*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resizeCanvas);
resizeCanvas();

function render(){
 if(!game||!players.length)return;

 const me=players.find(p=>p.id===myId)||players[0];
 if(!me)return;

 const width=canvas.clientWidth;
 const height=canvas.clientHeight;

 ctx.clearRect(0,0,width,height);

 const cameraX=Math.max(0,Math.min(WORLD.w-width,me.x-width/2));
 const cameraY=Math.max(0,Math.min(WORLD.h-height,me.y-height/2));

 ctx.save();
 ctx.translate(-cameraX,-cameraY);

 drawWorld();
 drawTasks();
 drawHidingSpots();
 drawBoat();
 drawPlayers(me);

 ctx.restore();
}

function drawWorld(){
 ctx.fillStyle="#163e49";
 ctx.fillRect(0,0,WORLD.w,WORLD.h);

 ctx.fillStyle="#78875b";
 ctx.fillRect(90,90,WORLD.w-180,WORLD.h-180);

 ctx.strokeStyle="#d3c18b";
 ctx.lineWidth=26;
 ctx.strokeRect(103,103,WORLD.w-206,WORLD.h-206);

 ctx.strokeStyle="#667d4d";
 ctx.lineWidth=3;

 for(let x=130;x<WORLD.w-130;x+=90){
  for(let y=130;y<WORLD.h-130;y+=90){
   ctx.beginPath();
   ctx.moveTo(x,y);
   ctx.lineTo(x+12,y+8);
   ctx.stroke();
  }
 }

 BUILDINGS.forEach((b,i)=>{
  ctx.fillStyle="#394b50";
  ctx.fillRect(b.x,b.y,b.w,b.h);

  ctx.fillStyle="#586b6b";
  ctx.fillRect(b.x+9,b.y+9,b.w-18,b.h-18);

  ctx.fillStyle="#26383c";
  ctx.fillRect(b.x+b.w/2-30,b.y+b.h-16,60,16);

  ctx.fillStyle="#d5c7a0";
  ctx.font="bold 13px Arial";
  ctx.textAlign="center";
  ctx.fillText(b.name,b.x+b.w/2,b.y+28);
 });

 TREES.forEach(([x,y])=>{
  ctx.fillStyle="#4c4935";
  ctx.fillRect(x-5,y+7,10,20);

  ctx.fillStyle="#284b35";
  ctx.beginPath();
  ctx.arc(x,y,25,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#3d6941";
  ctx.beginPath();
  ctx.arc(x-8,y-8,15,0,Math.PI*2);
  ctx.fill();
 });

 // Dock
 ctx.fillStyle="#765b3d";
 ctx.fillRect(1390,1160,260,38);
 ctx.fillRect(1590,1190,38,120);
 ctx.fillRect(1430,1190,38,120);

 ctx.fillStyle="#d1b38a";
 ctx.font="bold 13px Arial";
 ctx.textAlign="center";
 ctx.fillText("DOCK",1515,1150);
}

function drawTasks(){
 game.tasks.forEach(t=>{
  ctx.fillStyle=t.done?"#5fbd75":"#d6a64e";
  ctx.fillRect(t.x-17,t.y-17,34,34);

  ctx.strokeStyle="#17242b";
  ctx.lineWidth=3;
  ctx.strokeRect(t.x-17,t.y-17,34,34);

  ctx.fillStyle="#101b20";
  ctx.font="bold 17px Arial";
  ctx.textAlign="center";
  ctx.fillText(t.done?"✓":"!",t.x,t.y+6);

  ctx.fillStyle="#f0e6cf";
  ctx.font="12px Arial";
  ctx.fillText(t.name,t.x,t.y-27);
 });
}

function drawHidingSpots(){
 HIDING_SPOTS.forEach(s=>{
  ctx.fillStyle="#574a38";
  ctx.fillRect(s.x,s.y,s.w,s.h);

  ctx.strokeStyle="#c6ad78";
  ctx.lineWidth=2;
  ctx.strokeRect(s.x,s.y,s.w,s.h);

  ctx.fillStyle="#e0d1a8";
  ctx.font="10px Arial";
  ctx.textAlign="center";
  ctx.fillText("HIDE",s.x+s.w/2,s.y+s.h/2+4);
 });
}

function drawBoat(){
 const b=game.boat;
 const ready=game.tasks.every(t=>t.done);

 ctx.fillStyle="#332b26";
 ctx.beginPath();
 ctx.moveTo(b.x-58,b.y-25);
 ctx.lineTo(b.x+58,b.y-25);
 ctx.lineTo(b.x+42,b.y+30);
 ctx.lineTo(b.x-42,b.y+30);
 ctx.closePath();
 ctx.fill();

 ctx.fillStyle="#b78c51";
 ctx.fillRect(b.x-42,b.y-12,84,24);

 ctx.fillStyle=ready?"#7de39a":"#c6a05f";
 ctx.font="bold 13px Arial";
 ctx.textAlign="center";
 ctx.fillText(ready?"BOAT READY":"BOAT",b.x,b.y-42);
}

function drawPlayers(me){
 players.forEach(p=>{
  if(!p.alive||p.escaped||p.hidden)return;

  ctx.save();
  ctx.translate(p.x,p.y);

  ctx.fillStyle=p.role==="hunter"?"#c44f4f":"#4d9cbd";
  ctx.beginPath();
  ctx.arc(0,0,15,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#e5e8e8";
  ctx.lineWidth=2;
  ctx.stroke();

  ctx.fillStyle="#f4f0df";
  ctx.beginPath();
  ctx.arc(0,-3,6,0,Math.PI*2);
  ctx.fill();

  ctx.restore();

  ctx.fillStyle="#ffffff";
  ctx.font="12px Arial";
  ctx.textAlign="center";
  ctx.fillText(p.name,p.x,p.y-23);
 });

 // Highlight local player
 if(me.alive&&!me.hidden&&!me.escaped){
  ctx.strokeStyle="#f3d37a";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(me.x,me.y,21,0,Math.PI*2);
  ctx.stroke();
 }
}

/* =========================================
   UTILITIES
========================================= */

function escapeHtml(value){
 return String(value).replace(/[&<>"']/g,char=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 })[char]);
}

/* =========================================
   INITIAL SETUP
========================================= */

$("playerName").value=
 "Player"+Math.floor(100+Math.random()*900);

showScreen("menu");
setStatus("Ready. Create a room or join a friend.");

console.log("ISLAND ESCAPE loaded.");
console.log("PeerJS available:",!!window.Peer);
</script>
