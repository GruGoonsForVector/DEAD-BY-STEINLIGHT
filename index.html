
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEAD BY STEINLIGHT</title>
<script src="/socket.io/socket.io.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #090d0b;
  color: #e8eee9;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
  border: 1px solid #65766b;
  background: #27362d;
  color: white;
  padding: 12px 18px;
  border-radius: 5px;
  transition: .15s;
}

button:hover {
  background: #3c5544;
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

input {
  background: #101914;
  color: white;
  border: 1px solid #526257;
  padding: 12px;
  border-radius: 5px;
  width: 100%;
  margin: 5px 0 12px;
}

.screen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(ellipse at center, #25352b 0%, #101a14 55%, #060907 100%);
  z-index: 10;
}

.panel {
  width: min(440px, 92vw);
  background: rgba(9, 15, 11, .95);
  border: 1px solid #536455;
  padding: 28px;
  border-radius: 8px;
  box-shadow: 0 20px 80px #000;
}

h1 {
  margin: 0 0 8px;
  font-size: 35px;
  letter-spacing: 2px;
  text-align: center;
}

.subtitle {
  color: #9da99f;
  text-align: center;
  margin-bottom: 25px;
  font-size: 12px;
  letter-spacing: 3px;
}

.menuButtons {
  display: flex;
  gap: 8px;
}

.menuButtons button {
  flex: 1;
}

#status {
  min-height: 20px;
  color: #e1c98b;
  font-size: 13px;
  margin-top: 12px;
}

#lobbyPlayers {
  list-style: none;
  padding: 0;
  margin: 16px 0;
}

#lobbyPlayers li {
  padding: 10px;
  margin: 5px 0;
  background: #17231b;
  border-left: 3px solid #708d72;
}

#game {
  position: fixed;
  inset: 0;
  display: none;
  background: #101710;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#hud {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.hudPanel {
  position: absolute;
  background: rgba(5, 11, 7, .82);
  border: 1px solid rgba(180, 205, 185, .22);
  padding: 12px;
  border-radius: 5px;
  pointer-events: none;
}

#rolePanel {
  top: 15px;
  left: 15px;
  min-width: 170px;
}

#roleText {
  font-weight: bold;
  font-size: 18px;
  letter-spacing: 2px;
}

#objectivePanel {
  top: 15px;
  right: 15px;
  width: 245px;
}

#objectivePanel h3 {
  margin: 0 0 10px;
  font-size: 14px;
  letter-spacing: 1px;
}

.task {
  margin: 9px 0;
  font-size: 12px;
  color: #d5dfd7;
}

.taskBar {
  height: 5px;
  background: #26332a;
  margin-top: 5px;
  border-radius: 4px;
  overflow: hidden;
}

.taskFill {
  height: 100%;
  width: 0%;
  background: #83b88b;
  transition: width .15s linear;
}

#staminaPanel {
  position: absolute;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  width: 220px;
  text-align: center;
}

#staminaBar {
  height: 9px;
  background: #27332b;
  border-radius: 5px;
  overflow: hidden;
  margin-top: 6px;
}

#staminaFill {
  width: 100%;
  height: 100%;
  background: #a5c98e;
}

#controls {
  position: absolute;
  bottom: 15px;
  right: 15px;
  max-width: 260px;
  font-size: 11px;
  line-height: 1.7;
  color: #c6d0c8;
}

#controls strong {
  color: white;
  display: block;
  margin-bottom: 3px;
}

#notice {
  position: absolute;
  top: 110px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.8);
  padding: 12px 20px;
  border-radius: 5px;
  font-size: 14px;
  opacity: 0;
  transition: opacity .2s;
  text-align: center;
  max-width: 85vw;
}

#minimap {
  position: absolute;
  bottom: 15px;
  left: 15px;
  width: 160px;
  height: 125px;
  border: 1px solid #718477;
  background: rgba(5, 10, 7, .8);
}

#spectator {
  display: none;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,.85);
  padding: 14px 20px;
  border: 1px solid #788a7b;
  text-align: center;
}

#endScreen {
  display: none;
}

#endTitle {
  text-align: center;
  font-size: 32px;
  margin-bottom: 10px;
}

#endReason {
  text-align: center;
  color: #bdc9bf;
  margin-bottom: 22px;
}

#roleSpinner {
  position: absolute;
  inset: 0;
  z-index: 8;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.92);
  text-align: center;
  font-size: 30px;
  font-weight: bold;
  letter-spacing: 3px;
}

#roleSpinner small {
  display: block;
  font-size: 13px;
  color: #aab5ac;
  margin-top: 15px;
  letter-spacing: 1px;
}

@media(max-width:650px) {
  #objectivePanel {
    width: 190px;
    top: 10px;
    right: 10px;
  }

  #rolePanel {
    top: 10px;
    left: 10px;
  }

  #controls {
    display: none;
  }

  #minimap {
    width: 110px;
    height: 90px;
  }
}
</style>
</head>

<body>

<div id="menu" class="screen">
  <div class="panel">
    <h1>DEAD BY<br>STEINLIGHT</h1>
    <div class="subtitle">SURVIVE THE ISLAND</div>

    <label for="playerName">Player name</label>
    <input id="playerName" maxlength="18" placeholder="Enter your name">

    <button id="createButton" style="width:100%" onclick="createRoom()">
      CREATE ROOM
    </button>

    <div style="text-align:center;margin:15px;color:#87978b">OR JOIN A ROOM</div>

    <input id="joinCode" maxlength="6" placeholder="ROOM CODE">

    <button style="width:100%" onclick="joinRoom()">JOIN ROOM</button>

    <div id="status"></div>
  </div>
</div>

<div id="lobby" class="screen" style="display:none">
  <div class="panel">
    <h1>LOBBY</h1>
    <div class="subtitle">WAITING FOR PLAYERS</div>

    <div style="text-align:center">
      ROOM CODE
      <div id="roomCode" style="font-size:32px;font-weight:bold;letter-spacing:5px;margin:8px"></div>
      <button onclick="copyRoomCode()">COPY CODE</button>
    </div>

    <h3>Players</h3>
    <ul id="lobbyPlayers"></ul>

    <button id="startButton" style="width:100%;display:none" onclick="startGame()">
      START GAME
    </button>

    <button style="width:100%;margin-top:8px" onclick="leaveRoom()">
      LEAVE ROOM
    </button>

    <div id="lobbyStatus" style="color:#e1c98b;margin-top:12px;font-size:13px"></div>
  </div>
</div>

<div id="game">
  <canvas id="canvas"></canvas>

  <div id="hud">
    <div id="rolePanel" class="hudPanel">
      <div style="font-size:10px;color:#9eaea1">YOUR ROLE</div>
      <div id="roleText">ESCAPEE</div>
      <div id="playerLabel" style="font-size:11px;margin-top:5px"></div>
    </div>

    <div id="objectivePanel" class="hudPanel">
      <h3>OBJECTIVES</h3>
      <div id="taskList"></div>
      <div id="fuelCount" style="font-size:12px;margin-top:10px"></div>
    </div>

    <div id="notice"></div>

    <div id="staminaPanel" class="hudPanel">
      <div style="font-size:10px;letter-spacing:2px">STAMINA</div>
      <div id="staminaBar"><div id="staminaFill"></div></div>
    </div>

    <div id="controls" class="hudPanel"></div>

    <canvas id="minimap"></canvas>

    <div id="spectator">
      <strong>SPECTATING</strong>
      <div id="spectatorName"></div>
    </div>
  </div>

  <div id="roleSpinner">
    <div id="spinnerText">
      SELECTING ROLE...
      <small>PREPARE YOURSELF</small>
    </div>
  </div>
</div>

<div id="endScreen" class="screen">
  <div class="panel">
    <div id="endTitle">GAME OVER</div>
    <div id="endReason"></div>
    <button style="width:100%" onclick="returnToMenu()">RETURN TO MENU</button>
  </div>
</div>

<script>
const socket = io({
  reconnection: true,
  reconnectionAttempts: Infinity,
  timeout: 10000
});

const $ = id => document.getElementById(id);

const canvas = $("canvas");
const ctx = canvas.getContext("2d");

const mini = $("minimap");
const mctx = mini.getContext("2d");

const MAP = { width: 2800, height: 2200 };

const obstacles = [
  {x:450,y:300,w:550,h:360,name:"Mansion"},
  {x:1500,y:300,w:550,h:380,name:"Workshop"},
  {x:350,y:1250,w:550,h:360,name:"Cabin"},
  {x:1550,y:1250,w:500,h:400,name:"Boathouse"},
  {x:1050,y:900,w:300,h:250,name:"Ruins"},
  {x:2250,y:500,w:180,h:180,name:"Shed"},
  {x:2250,y:1450,w:180,h:180,name:"Dock Store"}
];

const hidingSpots = [
  {id:"locker1",x:550,y:500,type:"Locker"},
  {id:"locker2",x:1200,y:650,type:"Locker"},
  {id:"locker3",x:1750,y:500,type:"Locker"},
  {id:"wardrobe1",x:750,y:750,type:"Wardrobe"},
  {id:"wardrobe2",x:1850,y:750,type:"Wardrobe"},
  {id:"bed1",x:600,y:1450,type:"Bed"},
  {id:"bush1",x:600,y:1050,type:"Bush"},
  {id:"bush2",x:1750,y:1450,type:"Bush"},
  {id:"bush3",x:2300,y:1100,type:"Bush"}
];

let roomCode = "";
let myRole = "escapee";
let myId = socket.id;
let gameState = null;
let gameStarted = false;
let spectatorMode = false;
let lastNotice = "";
let noticeTimer = 0;

let camera = {x:0,y:0};
let cameraTarget = {x:0,y:0};

let snapshots = new Map();
let lastStateTime = 0;
let lastFrame = performance.now();

let keys = {};
let inputTimer = null;
let localStamina = 100;

let sceneCanvas = document.createElement("canvas");
sceneCanvas.width = MAP.width;
sceneCanvas.height = MAP.height;
let sceneCtx = sceneCanvas.getContext("2d");

let taskElements = new Map();
let lastTaskValues = new Map();

function setStatus(message) {
  $("status").textContent = message;
}

function showNotice(message) {
  $("notice").textContent = message;
  $("notice").style.opacity = "1";
  noticeTimer = 2400;
}

function createRoom() {
  const name = $("playerName").value.trim();
  if (!name) return setStatus("Enter a name first.");

  setStatus("Creating room...");
  socket.emit("createRoom", {name});
}

function joinRoom() {
  const name = $("playerName").value.trim();
  const code = $("joinCode").value.trim().toUpperCase();

  if (!name) return setStatus("Enter a name first.");
  if (!code) return setStatus("Enter a room code.");

  setStatus("Joining room...");
  socket.emit("joinRoom", {name, code});
}

function startGame() {
  socket.emit("startGame");
}

function copyRoomCode() {
  navigator.clipboard?.writeText(roomCode);
  $("lobbyStatus").textContent = "Room code copied.";
}

function leaveRoom() {
  socket.emit("leaveRoom");
  clearGame();
  $("lobby").style.display = "none";
  $("menu").style.display = "flex";
}

function returnToMenu() {
  socket.emit("leaveRoom");
  clearGame();
  $("endScreen").style.display = "none";
  $("menu").style.display = "flex";
}

function clearGame() {
  gameStarted = false;
  gameState = null;
  snapshots.clear();
  keys = {};
  spectatorMode = false;

  if (inputTimer) {
    clearInterval(inputTimer);
    inputTimer = null;
  }

  $("game").style.display = "none";
  $("spectator").style.display = "none";
  $("roleSpinner").style.display = "none";
}

socket.on("connect", () => {
  myId = socket.id;
});

socket.on("disconnect", () => {
  showNotice("Connection lost. Reconnecting...");
});

socket.on("notice", message => {
  showNotice(message);
});

socket.on("roomCreated", data => {
  roomCode = data.code;
  openLobby();
});

socket.on("roomJoined", data => {
  roomCode = data.code;
  openLobby();
});

socket.on("lobbyUpdate", data => {
  if (data.code !== roomCode) return;

  $("roomCode").textContent = data.code;

  $("lobbyPlayers").innerHTML = "";

  for (const player of data.players) {
    const li = document.createElement("li");
    li.textContent =
      player.name + (player.id === data.hostId ? "  ★ HOST" : "");
    $("lobbyPlayers").appendChild(li);
  }

  $("startButton").style.display =
    data.hostId === myId ? "block" : "none";

  $("startButton").disabled = data.players.length < 2;

  $("lobbyStatus").textContent =
    `${data.players.length}/5 players`;
});

function openLobby() {
  $("menu").style.display = "none";
  $("lobby").style.display = "flex";
  $("lobbyStatus").textContent = "Waiting for players...";
}

socket.on("gameStarted", data => {
  myId = socket.id;
  myRole = data.hunterId === myId ? "hunter" : "escapee";

  gameStarted = true;
  spectatorMode = false;

  $("menu").style.display = "none";
  $("lobby").style.display = "none";
  $("endScreen").style.display = "none";
  $("game").style.display = "block";

  $("roleText").textContent =
    myRole === "hunter" ? "HUNTER" : "ESCAPEE";

  $("roleText").style.color =
    myRole === "hunter" ? "#d66c65" : "#a4d69b";

  $("playerLabel").textContent =
    myRole === "hunter" ? "HUNT DOWN THE ESCAPEES" : "REPAIR THE BOAT";

  $("controls").innerHTML = myRole === "hunter"
    ? `<strong>HUNTER CONTROLS</strong>
       WASD / ARROWS: Move<br>
       SHIFT: Sprint<br>
       E: Search locker<br>
       R: Tracking pulse<br>
       F: Disrupt station`
    : `<strong>ESCAPEE CONTROLS</strong>
       WASD / ARROWS: Move<br>
       SHIFT: Sprint<br>
       CTRL: Crouch<br>
       E (HOLD): Repair / Collect / Escape<br>
       H: Hide / Unhide`;

  buildScene();
  buildTaskPanel();

  $("roleSpinner").style.display = "flex";

  let count = 0;
  const spin = setInterval(() => {
    $("spinnerText").innerHTML =
      count % 2 === 0
        ? "SELECTING ROLE...<small>THE ISLAND IS WAITING</small>"
        : "PREPARE YOURSELF...<small>THERE IS NO ESCAPE</small>";

    count++;

    if (count >= 7) {
      clearInterval(spin);

      $("spinnerText").innerHTML =
        myRole === "hunter"
          ? `YOU ARE THE HUNTER<small>FIND THEM BEFORE THEY ESCAPE</small>`
          : `YOU ARE AN ESCAPEE<small>REPAIR THE BOAT AND GET OUT</small>`;

      setTimeout(() => {
        $("roleSpinner").style.display = "none";
      }, 1800);
    }
  }, 350);

  receiveState(data.state);

  if (inputTimer) clearInterval(inputTimer);
  inputTimer = setInterval(sendInput, 1000 / 30);
});

socket.on("state", state => {
  receiveState(state);
});

socket.on("gameOver", data => {
  gameStarted = false;

  if (inputTimer) {
    clearInterval(inputTimer);
    inputTimer = null;
  }

  $("game").style.display = "none";
  $("endScreen").style.display = "flex";

  $("endTitle").textContent =
    data.winner === "escapees" ? "ESCAPEES WIN" : "HUNTER WINS";

  $("endTitle").style.color =
    data.winner === "escapees" ? "#a4d69b" : "#d66c65";

  $("endReason").textContent = data.reason;
});

function receiveState(state) {
  if (!state || !Array.isArray(state.players)) return;

  const now = performance.now();

  for (const player of state.players) {
    if (player.x == null || player.y == null) continue;

    if (!snapshots.has(player.id)) snapshots.set(player.id, []);

    const list = snapshots.get(player.id);

    list.push({
      x: player.x,
      y: player.y,
      time: now,
      hidden: player.hidden
    });

    while (list.length > 8) list.shift();
  }

  gameState = state;
  lastStateTime = now;

  updateTaskPanel();
  updateSpectator();
  updateStamina();
}

function buildTaskPanel() {
  $("taskList").innerHTML = "";
  taskElements.clear();

  const tasks = [
    ["basement", "Basement Exit"],
    ["engine", "Boat Engine"],
    ["hull", "Boat Hull"],
    ["electrics", "Boat Electrics"]
  ];

  for (const [id, name] of tasks) {
    const wrapper = document.createElement("div");
    wrapper.className = "task";

    const label = document.createElement("div");
    label.textContent = name;

    const bar = document.createElement("div");
    bar.className = "taskBar";

    const fill = document.createElement("div");
    fill.className = "taskFill";

    bar.appendChild(fill);
    wrapper.append(label, bar);
    $("taskList").appendChild(wrapper);

    taskElements.set(id, {label, fill});
  }
}

function updateTaskPanel() {
  if (!gameState) return;

  for (const task of gameState.tasks || []) {
    const element = taskElements.get(task.id);
    if (!element) continue;

    const value = Math.round(task.progress);

    if (lastTaskValues.get(task.id) !== value) {
      element.fill.style.width = value + "%";
      element.label.textContent =
        task.name + (value >= 100 ? " ✓" : `  ${value}%`);

      lastTaskValues.set(task.id, value);
    }
  }

  const collected = (gameState.fuel || []).filter(f => f.collected).length;
  $("fuelCount").textContent = `Fuel cans: ${collected}/2`;
}

function updateStamina() {
  const me = getMe();
  if (!me) return;

  $("staminaFill").style.width = Math.max(0, me.stamina) + "%";
}

function getMe() {
  if (!gameState) return null;
  return gameState.players.find(p => p.id === myId);
}

function updateSpectator() {
  const me = getMe();

  if (!me || myRole !== "escapee" || me.alive || me.escaped) {
    spectatorMode = false;
    $("spectator").style.display = "none";
    return;
  }

  const targets = gameState.players.filter(p =>
    p.role === "escapee" &&
    p.alive &&
    !p.escaped &&
    p.x != null
  );

  spectatorMode = true;
  $("spectator").style.display = "block";

  if (targets.length) {
    const target = targets[0];
    $("spectatorName").textContent = target.name;
  } else {
    $("spectatorName").textContent = "Waiting for the match to end...";
  }
}

function getRenderedPosition(player, renderTime) {
  const list = snapshots.get(player.id);

  if (!list || list.length === 0) {
    return {x: player.x, y: player.y};
  }

  if (list.length === 1) {
    return {x: list[0].x, y: list[0].y};
  }

  const targetTime = renderTime - 100;

  let before = list[0];
  let after = list[list.length - 1];

  for (let i = 0; i < list.length - 1; i++) {
    if (
      list[i].time <= targetTime &&
      list[i + 1].time >= targetTime
    ) {
      before = list[i];
      after = list[i + 1];
      break;
    }
  }

  const duration = after.time - before.time;
  const t = duration > 0
    ? Math.max(0, Math.min(1, (targetTime - before.time) / duration))
    : 1;

  return {
    x: before.x + (after.x - before.x) * t,
    y: before.y + (after.y - before.y) * t
  };
}

function buildScene() {
  const c = sceneCtx;

  c.clearRect(0, 0, MAP.width, MAP.height);

  c.fillStyle = "#26392a";
  c.fillRect(0, 0, MAP.width, MAP.height);

  // Grass details.
  for (let i = 0; i < 6500; i++) {
    const x = Math.random() * MAP.width;
    const y = Math.random() * MAP.height;

    c.fillStyle = Math.random() > .5
      ? "rgba(120,155,100,.11)"
      : "rgba(5,18,8,.16)";

    c.fillRect(x, y, 2, 2);
  }

  // Paths.
  c.strokeStyle = "#6b7053";
  c.lineWidth = 100;
  c.lineCap = "round";

  c.beginPath();
  c.moveTo(200, 1100);
  c.lineTo(1100, 1100);
  c.lineTo(1400, 1000);
  c.lineTo(2300, 1800);
  c.stroke();

  c.strokeStyle = "#8b896a";
  c.lineWidth = 4;
  c.stroke();

  // Water.
  c.fillStyle = "#244b52";
  c.fillRect(0, 2050, MAP.width, 150);

  c.fillStyle = "#315d62";
  for (let i = 0; i < 100; i++) {
    c.fillRect(Math.random() * MAP.width, 2060 + Math.random() * 125, 30, 2);
  }

  // Buildings.
  for (const o of obstacles) {
    c.fillStyle = "#202923";
    c.fillRect(o.x - 8, o.y - 8, o.w + 16, o.h + 16);

    c.fillStyle = "#777565";
    c.fillRect(o.x, o.y, o.w, o.h);

    c.fillStyle = "#4b5047";
    c.fillRect(o.x + 12, o.y + 12, o.w - 24, o.h - 24);

    c.strokeStyle = "#aaa58c";
    c.lineWidth = 5;
    c.strokeRect(o.x, o.y, o.w, o.h);

    c.fillStyle = "#ddd2a7";
    c.font = "bold 24px Arial";
    c.textAlign = "center";
    c.fillText(o.name.toUpperCase(), o.x + o.w / 2, o.y + 38);
  }

  // Trees.
  for (let i = 0; i < 190; i++) {
    const x = Math.random() * MAP.width;
    const y = Math.random() * MAP.height;

    if (obstacles.some(o =>
      x > o.x - 40 && x < o.x + o.w + 40 &&
      y > o.y - 40 && y < o.y + o.h + 40
    )) continue;

    drawTree(c, x, y);
  }

  // Boat.
  c.save();
  c.translate(2350, 1850);
  c.fillStyle = "#b7a078";
  c.beginPath();
  c.moveTo(-100, -30);
  c.lineTo(100, -30);
  c.lineTo(75, 35);
  c.lineTo(-75, 35);
  c.closePath();
  c.fill();

  c.strokeStyle = "#4b3524";
  c.lineWidth = 5;
  c.stroke();
  c.restore();

  c.fillStyle = "#eee3bf";
  c.font = "bold 22px Arial";
  c.textAlign = "center";
  c.fillText("ESCAPE BOAT", 2350, 1810);

  // Hiding places.
  for (const spot of hidingSpots) {
    drawHidingSpot(c, spot);
  }

  // Border.
  c.strokeStyle = "#a0ad8a";
  c.lineWidth = 10;
  c.strokeRect(0, 0, MAP.width, MAP.height);
}

function drawTree(c, x, y) {
  c.fillStyle = "rgba(0,0,0,.25)";
  c.beginPath();
  c.ellipse(x + 8, y + 12, 25, 17, 0, 0, Math.PI * 2);
  c.fill();

  c.fillStyle = "#574832";
  c.fillRect(x - 5, y - 4, 10, 25);

  c.fillStyle = "#1b3523";
  c.beginPath();
  c.arc(x, y - 12, 23, 0, Math.PI * 2);
  c.fill();

  c.fillStyle = "#345b35";
  c.beginPath();
  c.arc(x - 8, y - 20, 14, 0, Math.PI * 2);
  c.fill();
}

function drawHidingSpot(c, spot) {
  c.save();
  c.translate(spot.x, spot.y);

  if (spot.type === "Bush") {
    c.fillStyle = "#244a2b";
    c.beginPath();
    c.arc(0, 0, 23, 0, Math.PI * 2);
    c.fill();

    c.fillStyle = "#3c6c3d";
    c.beginPath();
    c.arc(-8, -7, 13, 0, Math.PI * 2);
    c.fill();
  } else {
    c.fillStyle = "#302d28";
    c.fillRect(-16, -22, 32, 44);

    c.fillStyle = "#786d58";
    c.fillRect(-12, -18, 24, 36);

    c.strokeStyle = "#b5a88b";
    c.strokeRect(-12, -18, 24, 36);
  }

  c.restore();
}

function drawStation(c, task) {
  c.save();
  c.translate(task.x, task.y);

  c.fillStyle = "#151d19";
  c.fillRect(-25, -19, 50, 38);

  c.fillStyle = "#65776b";
  c.fillRect(-20, -15, 40, 30);

  c.fillStyle = "#263a2c";
  c.fillRect(-15, -10, 30, 20);

  c.fillStyle = task.progress >= 100 ? "#75c786" : "#d3b36b";
  c.fillRect(-10, -5, 20, 10);

  c.strokeStyle = "#bac9b6";
  c.lineWidth = 2;
  c.strokeRect(-20, -15, 40, 30);

  c.fillStyle = "#f2e9ca";
  c.font = "12px Arial";
  c.textAlign = "center";
  c.fillText(task.name, 0, -27);

  c.restore();
}

function drawFuel(c, fuel) {
  if (fuel.collected) return;

  c.save();
  c.translate(fuel.x, fuel.y);

  c.fillStyle = "#b78b36";
  c.fillRect(-8, -12, 16, 24);

  c.fillStyle = "#e1c36c";
  c.fillRect(-5, -16, 10, 5);

  c.fillStyle = "#45351c";
  c.fillRect(-4, -4, 8, 9);

  c.restore();
}

function drawPlayer(c, player, pos) {
  if (!player.alive || player.escaped || player.hidden) return;
  if (pos.x == null || pos.y == null) return;

  c.save();
  c.translate(pos.x, pos.y);

  c.fillStyle = "rgba(0,0,0,.35)";
  c.beginPath();
  c.ellipse(0, 8, 16, 9, 0, 0, Math.PI * 2);
  c.fill();

  if (player.role === "hunter") {
    c.fillStyle = "#671f24";
    c.beginPath();
    c.arc(0, -3, 15, 0, Math.PI * 2);
    c.fill();

    c.fillStyle = "#d7c5ae";
    c.fillRect(-8, -12, 16, 12);
  } else {
    c.fillStyle = "#9bb79a";
    c.beginPath();
    c.arc(0, -3, 13, 0, Math.PI * 2);
    c.fill();

    c.fillStyle = "#263d2a";
    c.fillRect(-10, 5, 20, 10);
  }

  if (player.id === myId) {
    c.strokeStyle = "#f1e8b5";
    c.lineWidth = 2;
    c.beginPath();
    c.arc(0, -2, 19, 0, Math.PI * 2);
    c.stroke();
  }

  c.fillStyle = "white";
  c.font = "11px Arial";
  c.textAlign = "center";
  c.fillText(player.name, 0, -24);

  c.restore();
}

function getFollowedPlayer() {
  const me = getMe();

  if (me && me.alive && !me.escaped && me.x != null) {
    return me;
  }

  if (me && myRole === "escapee") {
    return gameState.players.find(p =>
      p.role === "escapee" &&
      p.alive &&
      !p.escaped &&
      p.x != null
    );
  }

  return me;
}

function drawMinimap() {
  if (!gameState) return;

  const w = mini.width;
  const h = mini.height;

  mctx.clearRect(0, 0, w, h);
  mctx.fillStyle = "#25392b";
  mctx.fillRect(0, 0, w, h);

  const sx = w / MAP.width;
  const sy = h / MAP.height;

  for (const o of obstacles) {
    mctx.fillStyle = "#657064";
    mctx.fillRect(o.x * sx, o.y * sy, o.w * sx, o.h * sy);
  }

  for (const task of gameState.tasks || []) {
    mctx.fillStyle = task.progress >= 100 ? "#6fd084" : "#e5c36b";
    mctx.fillRect(task.x * sx - 2, task.y * sy - 2, 4, 4);
  }

  for (const fuel of gameState.fuel || []) {
    if (fuel.collected) continue;
    mctx.fillStyle = "#e0a83c";
    mctx.fillRect(fuel.x * sx - 2, fuel.y * sy - 2, 4, 4);
  }

  for (const p of gameState.players) {
    if (p.role !== myRole || !p.alive || p.x == null || p.hidden) continue;

    mctx.fillStyle = p.id === myId ? "#fff5a8" : "#8cd6a2";
    mctx.beginPath();
    mctx.arc(p.x * sx, p.y * sy, 3, 0, Math.PI * 2);
    mctx.fill();
  }

  if (myRole === "hunter") {
    const me = getMe();

    if (me && me.x != null) {
      mctx.fillStyle = "#ed6a65";
      mctx.beginPath();
      mctx.arc(me.x * sx, me.y * sy, 4, 0, Math.PI * 2);
      mctx.fill();
    }
  }
}

function render(now) {
  requestAnimationFrame(render);

  const width = canvas.clientWidth;
  const height = canvas.clientHeight;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  if (canvas.width !== Math.round(width * dpr) ||
      canvas.height !== Math.round(height * dpr)) {
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
  }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const dt = Math.min((now - lastFrame) / 1000, .05);
  lastFrame = now;

  if (!gameStarted || !gameState) {
    ctx.fillStyle = "#101710";
    ctx.fillRect(0, 0, width, height);
    return;
  }

  if (noticeTimer > 0) {
    noticeTimer -= dt * 1000;
    if (noticeTimer <= 0) $("notice").style.opacity = "0";
  }

  const followed = getFollowedPlayer();

  if (followed) {
    const pos = getRenderedPosition(followed, now);

    cameraTarget.x = pos.x - width / 2;
    cameraTarget.y = pos.y - height / 2;

    camera.x += (cameraTarget.x - camera.x) * Math.min(1, dt * 9);
    camera.y += (cameraTarget.y - camera.y) * Math.min(1, dt * 9);
  }

  camera.x = Math.max(0, Math.min(MAP.width - width, camera.x));
  camera.y = Math.max(0, Math.min(MAP.height - height, camera.y));

  ctx.fillStyle = "#17251a";
  ctx.fillRect(0, 0, width, height);

  ctx.save();
  ctx.translate(-camera.x, -camera.y);

  ctx.drawImage(sceneCanvas, 0, 0);

  for (const task of gameState.tasks || []) {
    drawStation(ctx, task);
  }

  for (const fuel of gameState.fuel || []) {
    drawFuel(ctx, fuel);
  }

  for (const p of gameState.players) {
    if (p.x == null || p.y == null) continue;

    const pos = getRenderedPosition(p, now);
    drawPlayer(ctx, p, pos);
  }

  // Hunter tracking pulse visual.
  const me = getMe();

  if (me && me.role === "hunter" && me.pulse > 0) {
    const radius = 100 + (180 - me.pulse) * 4;

    ctx.strokeStyle = "rgba(210,80,80,.6)";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(me.x, me.y, radius, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();

  drawMinimap();
}

requestAnimationFrame(render);

function sendInput() {
  if (!gameStarted || !socket.connected) return;

  const me = getMe();

  if (!me || !me.alive || me.escaped || spectatorMode) {
    socket.emit("input", {});
    return;
  }

  const hunter = myRole === "hunter";

  socket.emit("input", {
    up: !!(keys.w || keys.arrowup),
    down: !!(keys.s || keys.arrowdown),
    left: !!(keys.a || keys.arrowleft),
    right: !!(keys.d || keys.arrowright),

    sprint: !!keys.shift,
    crouch: !hunter && !!keys.control,

    interact: !hunter && !!keys.e,
    hide: !hunter && !!keys.h,

    search: hunter && !!keys.e,
    pulse: hunter && !!keys.r,
    disrupt: hunter && !!keys.f
  });
}

window.addEventListener("keydown", event => {
  const key = event.key.toLowerCase();

  if (
    ["arrowup", "arrowdown", "arrowleft", "arrowright", " "]
      .includes(key)
  ) event.preventDefault();

  if (
    document.activeElement &&
    ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)
  ) return;

  keys[key] = true;
});

window.addEventListener("keyup", event => {
  keys[event.key.toLowerCase()] = false;
});

window.addEventListener("blur", () => {
  keys = {};
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden) keys = {};
});

window.addEventListener("resize", () => {
  if (gameStarted) drawMinimap();
});
</script>
</body>
</html>
